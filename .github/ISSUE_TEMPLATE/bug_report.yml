name: Bug Report
description: Something isn't working
labels: ['bug']
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report this.

      If the problem also happens on upstream Radarr, it's probably better reported
      [there](https://github.com/Radarr/Radarr/issues) — but if you're not sure, report it
      here and we'll work it out.

- type: textarea
  attributes:
    label: What happened
    description: What you expected, and what you got instead.
  validations:
    required: true

- type: input
  attributes:
    label: Movie or release involved
    description: >-
      If it's about a specific movie or a specific release name, put it here. Many bugs
      turn out to be specific to one title or one release, so this is usually the single
      most useful thing in a report.
    placeholder: e.g. The Matrix (1999), or The.Matrix.1999.2160p.UHD.BluRay.REMUX-GROUP

- type: dropdown
  attributes:
    label: Area
    description: Which part of Radarr Pro is involved, if you know?
    options:
      - Not sure
      - Fake release filtering
      - qBittorrent download reuse
      - Compression
      - Folder renaming / naming
      - Interactive search
      - Mobile layout
      - Something upstream Radarr also does

- type: textarea
  attributes:
    label: Logs
    description: >-
      Relevant lines from System → Logs. If you can reproduce it on demand, set the log
      level to Debug or Trace under Settings → General first.
    render: shell

- type: input
  attributes:
    label: Version
    description: Found under System → Status, or the image tag you pulled.
    placeholder: e.g. v1.0.0, or ghcr.io/kakarottocake/radarr-pro:latest
  validations:
    required: true
